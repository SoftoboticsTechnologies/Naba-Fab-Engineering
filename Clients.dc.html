<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #eef1f4; color: #16202b; font-family: "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #0b4a8f; }
  a:hover { color: #1769c4; }
</style>
</helmet>
<div style="display:flex; flexDirection:column; minHeight:100vh; background:#eef1f4">
  <dc-import name="Site Header" hint-size="100%,68px"></dc-import>
  <main style="flex:1; minWidth:0; padding:20px clamp(12px,3vw,28px) 28px; display:flex; flexDirection:column; gap:20px">
    <section style="borderRadius:28px; background:#0b2440; color:#ffffff; padding:clamp(24px,4vw,56px)">
      <div style="fontFamily:'IBM Plex Mono',monospace; fontSize:12px; letterSpacing:2.2px; color:#8dc0f2; marginBottom:16px">OUR CLIENTS</div>
      <h1 style="fontFamily:'Archivo',sans-serif; fontSize:clamp(28px,4vw,44px); lineHeight:1.1; fontWeight:800; letterSpacing:-1.2px; margin:0 0 36px; maxWidth:760px">Trusted by refineries, oil mills and chemical plants</h1>
      <div style="display:flex; flexWrap:wrap; gap:12px">
        <sc-for list="{{ clients }}" as="c" hint-placeholder-count="16">
          <div style="borderRadius:999px; border:1px solid rgba(255,255,255,0.22); background:rgba(255,255,255,0.05); padding:14px 26px; fontSize:16px; fontWeight:500">{{ c }}</div>
        </sc-for>
      </div>
      <p style="margin:24px 0 0; fontFamily:'IBM Plex Mono',monospace; fontSize:12px; letterSpacing:1.4px; color:#8dc0f2">CLIENT LOGOS CAN BE DROPPED IN PLACE OF THE NAMES ABOVE</p>
      <a href="Contact.dc.html" style="display:inline-block; marginTop:32px; borderRadius:999px; background:#ffffff; color:#0b2440; padding:15px 28px; fontFamily:'Archivo',sans-serif; fontWeight:700; fontSize:16px; textDecoration:none" style-hover="background:#e7eff8">Work with us</a>
    </section>
    <dc-import name="Site Footer" hint-size="100%,320px"></dc-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { clients: ["Budge Budge Refineries Ltd.","Kanchan Oil Industries Ltd.","Purty Vanaspati (P) Ltd.","Vinayak Oil & Fats (P) Ltd.","Hemraj Industries (P) Ltd.","Burdwan Agro (P) Ltd.","Sresth Products (P) Ltd.","Sresth Ora Products (P) Ltd.","Indo Tan Chemicals","Edible Oil Products Ltd.","Frick India Ltd.","Global Recycling","Hindusthan Storage & Distribution Co Ltd.","Hooghly Agro Products (P) Ltd.","RRJ Udyog LLP","Soma Agro Oil (P) Ltd."] };
  }
}
</script>
</body>
</html>
