<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #eef1f4; color: #16202b; font-family: "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #0b4a8f; }
  a:hover { color: #1769c4; }
</style>
</helmet>
<div style="display:flex; flexDirection:column; minHeight:100vh; background:#eef1f4">
  <dc-import name="Site Header" hint-size="100%,68px"></dc-import>
  <main style="flex:1; minWidth:0; padding:20px clamp(12px,3vw,28px) 28px; display:flex; flexDirection:column; gap:20px">
    <section style="borderRadius:28px; background:#ffffff; padding:clamp(24px,4vw,56px)">
      <div style="fontFamily:'IBM Plex Mono',monospace; fontSize:12px; letterSpacing:2.2px; color:#0b4a8f; marginBottom:16px">SPECIALIST IN</div>
      <h1 style="fontFamily:'Archivo',sans-serif; fontSize:clamp(28px,4vw,44px); lineHeight:1.1; fontWeight:800; letterSpacing:-1.2px; margin:0 0 14px; color:#0b2440">Core technical capabilities</h1>
      <p style="margin:0 0 36px; maxWidth:620px; fontSize:17px; lineHeight:1.65; color:#5b6975">Process plant work is where we are strongest. Each of these is a job we staff, supervise and complete regularly.</p>
      <div style="display:grid; gridTemplateColumns:repeat(auto-fit,minmax(260px,1fr)); gap:14px">
        <sc-for list="{{ items }}" as="item" hint-placeholder-count="13">
          <div style="borderRadius:18px; background:#f4f6f8; padding:24px 26px; display:flex; alignItems:center; gap:16px">
            <div style="width:34px; height:34px; flexShrink:0; borderRadius:999px; background:#0b4a8f; color:#fff; display:grid; placeItems:center; fontFamily:'IBM Plex Mono',monospace; fontSize:12px">{{ item.n }}</div>
            <div style="fontFamily:'Archivo',sans-serif; fontWeight:700; fontSize:18px; color:#0b2440; lineHeight:1.3">{{ item.name }}</div>
          </div>
        </sc-for>
        <div style="borderRadius:18px; background:#eef4fb; padding:24px 26px; display:flex; alignItems:center; justifyContent:space-between; gap:16px; flexWrap:wrap">
          <div style="fontSize:16px; color:#33414f">Need a trade not listed here?</div>
          <a href="Contact.dc.html" style="borderRadius:999px; background:#0b4a8f; color:#ffffff; padding:12px 22px; fontFamily:'Archivo',sans-serif; fontWeight:700; fontSize:15px; textDecoration:none" style-hover="background:#093a70">Ask us</a>
        </div>
      </div>
    </section>
    <dc-import name="Site Footer" hint-size="100%,320px"></dc-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const names = ["Solvent extraction","Refinery","Hydrogenation","Chimney and structure work","Tank vessel fabrication and erection maintenance job","Boiler","Wax press","Filter press","Pouch machine operating","Industrial automation","Any packaging operation","Hot and cold insulation","Fibre glass coating"];
    return { items: names.map((name, i) => ({ name, n: String(i + 1).padStart(2, "0") })) };
  }
}
</script>
</body>
</html>
